function renderDefaultStatusMarkerBanner(){
  if (!state.defaultStatusMarker) return '';
  const m = state.defaultStatusMarker;
  let waktuStr = '';
  try{ waktuStr = new Date(m.updatedAt).toLocaleString('id-ID'); }catch(e){ waktuStr = m.updatedAt; }
  return `<div style="font-size:11.5px;color:var(--ink-soft);background:var(--neutral-bg);border-radius:7px;padding:6px 11px;margin-bottom:10px;">
    &#128204; Default STATUS STOCK saat ini dari: <strong>${esc(m.store)}</strong> &middot; ${esc(m.statusTypeLabel)} &middot; ${m.itemCount} item &middot; diupdate ${esc(waktuStr)}
  </div>`;
}

function renderStatusStockFilterBar(){
  if (!state.statusStockData){
    return renderDefaultStatusMarkerBanner() + `<div class="filter-bar" style="margin-bottom:10px;">
      <span style="font-size:12px;color:var(--ink-faint);">&#128202; Status default sudah otomatis termuat dari sheet STATUS STOCK (tanpa perlu upload). Klik <strong>Upload Status Stock</strong> di atas kalau mau lihat/atur status per toko/DC tertentu sebagai overlay.</span>${state.statusStockDefaultLoadError?`<br/><span style="font-size:11.5px;color:var(--critical-fg);">${ICONS.warn} ${esc(state.statusStockDefaultLoadError)}</span>`:''}
    </div>`;
  }
  const storeOptions = state.statusStockData.sheetNames;
  const statusTypeOptions = state.statusFilterStore ? getStatusTypeOptions(state.statusFilterStore) : [];
  const overlayActive = Boolean(state.statusFilterStore && state.statusFilterStatusType);
  const activeLabel = overlayActive ? (getStatusTypeOptions(state.statusFilterStore).find(o=>o.value===state.statusFilterStatusType)||{}).label : '';

  let html = renderDefaultStatusMarkerBanner();
  html += `<div class="filter-bar" style="${overlayActive?'background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:9px 12px;':'margin-bottom:10px;'}">
    <span class="filter-label">Status stock</span>
    <select class="control" id="statusFilterStoreSelect">
      <option value="">(pakai default Data Tracking)</option>
      ${storeOptions.map(s=>`<option value="${esc(s)}" ${state.statusFilterStore===s?'selected':''}>${esc(s)}</option>`).join('')}
    </select>
    ${state.statusFilterStore ? `
      <select class="control" id="statusFilterStatusTypeSelect">
        <option value="">Pilih jenis status...</option>
        ${statusTypeOptions.map(o=>`<option value="${o.value}" ${state.statusFilterStatusType===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select>
    ` : ''}
    ${overlayActive ? `<span class="badge badge-critical">Overlay aktif: ${esc(state.statusFilterStore)} &middot; ${esc(activeLabel)}</span>
      <button class="reset-btn" id="statusOverlayResetBtn">&times; Kembali ke default</button>
      <button class="refresh-btn" id="pushStatusStockBtn" ${state.statusStockUpdating?'disabled':''}>${state.statusStockUpdating?'Mengirim...':'&#128228; Update Status Stock (jadi default)'}</button>` : ''}
    <span style="font-size:11px;color:var(--ink-faint);margin-left:auto;">File: ${esc(state.statusStockFileName)}</span>
  </div>`;
  return html;
}

function render(){
  const d = computeDerived();
  const f = state.filters;
  const hasActiveFilters = Boolean(f.search) || f.warna.length>0 || Boolean(f.kain) || Boolean(f.status);
  const activeId = document.activeElement ? document.activeElement.id : null;
  const activeSelStart = ['searchInput','koliSearchInput','bongkarSearchInput','ciSearchInput','opSearchInput','umSearchInput'].includes(activeId) && document.activeElement.selectionStart!=null
    ? document.activeElement.selectionStart : null;

  const dbForCount = computeBongkarDerived();
  const umForCount = computeUnmatchedDerived();

  let html = `
    <div class="dash-header">
      <div>
        <div class="eyebrow">GARMENT INVENTORY OPS</div>
        <h1 class="title">Data tracking stock dari vendor ke DC</h1>
      </div>
      <div class="header-actions">
        ${state.lastUpdated ? `<span class="updated-at">Update: ${state.lastUpdated.toLocaleTimeString('id-ID')}</span>` : ''}
        <input type="file" id="statusStockFileInput" accept=".xlsx,.xls" style="display:none" />
        <button class="upload-btn" id="statusStockUploadBtn">&#128202; Upload Status Stock</button>
        <button class="refresh-btn" id="refreshBtn" ${state.loading?'disabled':''}><span class="${state.loading?'spin':''}">&#8635;</span> ${state.loading?'Memuat':'Refresh'}</button>
      </div>
    </div>
    ${state.error ? `<div class="error-banner">${ICONS.warn} ${esc(state.error)} Pastikan sheet masih ter-publish ke web dan Anda buka file ini lewat browser (bukan dari dalam Claude).</div>` : ''}
    <div class="tabs">
      <button class="tab-btn ${state.tab==='ringkasan'?'active':''}" data-tab="ringkasan">Ringkasan item</button>
      <button class="tab-btn ${state.tab==='critical'?'active':''}" data-tab="critical">
        Critical &amp; cari koli ${d.totals.critical>0?`<span class="tab-count">${d.totals.critical}</span>`:''}
      </button>
      <button class="tab-btn ${state.tab==='bongkar'?'active':''}" data-tab="bongkar">
        Prioritas bongkar inbound ${dbForCount.totalCriticalCount>0?`<span class="tab-count">${dbForCount.totalCriticalCount}</span>`:''}
      </button>
      <button class="tab-btn ${state.tab==='criticalitem'?'active':''}" data-tab="criticalitem">Critical item</button>
      <button class="tab-btn ${state.tab==='onproduction'?'active':''}" data-tab="onproduction">On production</button>
      <button class="tab-btn ${state.tab==='unmatched'?'active':''}" data-tab="unmatched">
        Item tidak cocok ${umForCount.total>0?`<span class="tab-count">${umForCount.total}</span>`:''}
      </button>
    </div>
  `;

  if (state.tab !== 'criticalitem' && state.tab !== 'unmatched' && state.tab !== 'onproduction') html += renderStatusStockFilterBar();

  if (state.tab==='ringkasan') html += renderRingkasanTab(d, f, hasActiveFilters);
  else if (state.tab==='critical') html += renderCriticalTab(d);
  else if (state.tab==='bongkar') html += renderBongkarTab();
  else if (state.tab==='criticalitem') html += renderCriticalItemTab();
  else if (state.tab==='onproduction') html += renderOnProductionTab();
  else html += renderUnmatchedTab();

  document.getElementById('app').innerHTML = html;
  attachEvents();

  if (activeId){
    const newActive = document.getElementById(activeId);
    if (newActive){
      newActive.focus();
      if (activeSelStart!=null && newActive.setSelectionRange){
        try { newActive.setSelectionRange(activeSelStart, activeSelStart); } catch(e){}
      }
    }
  }
}

function attachEvents(){
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) refreshBtn.onclick = loadData;

  const statusStockUploadBtn = document.getElementById('statusStockUploadBtn');
  const statusStockFileInput = document.getElementById('statusStockFileInput');
  if (statusStockUploadBtn && statusStockFileInput){
    statusStockUploadBtn.onclick = () => statusStockFileInput.click();
    statusStockFileInput.onchange = (e) => { if (e.target.files[0]) handleStatusStockUpload(e.target.files[0]); };
  }

  const statusFilterStoreSelect = document.getElementById('statusFilterStoreSelect');
  if (statusFilterStoreSelect) statusFilterStoreSelect.onchange = (e) => {
    state.statusFilterStore = e.target.value;
    state.statusFilterStatusType = ''; // reset jenis status tiap ganti store, biar user pilih ulang sesuai opsi yang tersedia
    render();
  };

  const statusFilterStatusTypeSelect = document.getElementById('statusFilterStatusTypeSelect');
  if (statusFilterStatusTypeSelect) statusFilterStatusTypeSelect.onchange = (e) => {
    state.statusFilterStatusType = e.target.value;
    render();
  };

  const statusOverlayResetBtn = document.getElementById('statusOverlayResetBtn');
  if (statusOverlayResetBtn) statusOverlayResetBtn.onclick = () => {
    state.statusFilterStore = '';
    state.statusFilterStatusType = '';
    render();
  };

  const pushStatusStockBtn = document.getElementById('pushStatusStockBtn');
  if (pushStatusStockBtn) pushStatusStockBtn.onclick = () => { pushStatusStockAsDefault(); };

  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => { state.tab = el.getAttribute('data-tab'); render(); };
  });

  // --- Ringkasan item ---
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.oninput = (e) => { state.filters.search = e.target.value; render(); };

  ['kain','status'].forEach(key => {
    const el = document.getElementById('filter'+key.charAt(0).toUpperCase()+key.slice(1));
    if (el) el.onchange = (e) => { state.filters[key] = e.target.value; render(); };
  });

  const warnaMsBtn = document.getElementById('warnaMsBtn');
  if (warnaMsBtn) warnaMsBtn.onclick = (e) => { e.stopPropagation(); state.warnaDropdownOpen = !state.warnaDropdownOpen; render(); };

  document.querySelectorAll('[data-warna-opt]').forEach(el => {
    el.onclick = (e) => e.stopPropagation();
    el.onchange = (e) => {
      const w = el.getAttribute('data-warna-opt');
      const set = new Set(state.filters.warna);
      if (e.target.checked) set.add(w); else set.delete(w);
      state.filters.warna = Array.from(set);
      render();
    };
  });

  if (state.warnaDropdownOpen){
    const panel = document.getElementById('warnaMsPanel');
    if (panel) panel.onclick = (e) => e.stopPropagation();
    setTimeout(() => {
      document.addEventListener('click', function closeWarnaMs(){
        state.warnaDropdownOpen = false; render();
        document.removeEventListener('click', closeWarnaMs);
      }, { once:true });
    }, 0);
  }

  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = () => { state.filters = { search:'', warna:[], kain:'', lengan:'', ukuran:'', status:'' }; state.warnaDropdownOpen=false; render(); };

  const ringkasanSortSelect = document.getElementById('ringkasanSortSelect');
  if (ringkasanSortSelect) ringkasanSortSelect.onchange = (e) => { state.ringkasanSortMode = e.target.value; render(); };

  document.querySelectorAll('[data-color-toggle]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-color-toggle');
      if (state.expandedColor.has(key)) state.expandedColor.delete(key); else state.expandedColor.add(key);
      render();
    };
  });
  document.querySelectorAll('[data-lengan-toggle]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-lengan-toggle');
      if (state.expandedLengan.has(key)) state.expandedLengan.delete(key); else state.expandedLengan.add(key);
      render();
    };
  });
  document.querySelectorAll('[data-expand]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-expand');
      if (state.expandedSet.has(key)) state.expandedSet.delete(key); else state.expandedSet.add(key);
      render();
    };
  });

  // --- Critical & cari koli ---
  const koliSearchInput = document.getElementById('koliSearchInput');
  if (koliSearchInput) koliSearchInput.oninput = (e) => { state.koliQuery = e.target.value; render(); };

  const prioritySortSelect = document.getElementById('prioritySortSelect');
  if (prioritySortSelect) prioritySortSelect.onchange = (e) => { state.priorityMode = e.target.value; render(); };

  const filterTglDelivery = document.getElementById('filterTglDelivery');
  if (filterTglDelivery) filterTglDelivery.onchange = (e) => { state.tglDeliveryFilter = e.target.value; render(); };

  const filterEstimasiMode = document.getElementById('filterEstimasiMode');
  if (filterEstimasiMode) filterEstimasiMode.onchange = (e) => { state.estimasiTibaMode = e.target.value; if (e.target.value!=='tanggal') state.estimasiTibaDate=''; render(); };

  const filterEstimasiDate = document.getElementById('filterEstimasiDate');
  if (filterEstimasiDate) filterEstimasiDate.onchange = (e) => { state.estimasiTibaDate = e.target.value; render(); };

  const resetDateBtn = document.getElementById('resetDateBtn');
  if (resetDateBtn) resetDateBtn.onclick = () => { state.tglDeliveryFilter=''; state.estimasiTibaMode='semua'; state.estimasiTibaDate=''; state.travelStatusFilter=''; render(); };

  const filterTravelStatus = document.getElementById('filterTravelStatus');
  if (filterTravelStatus) filterTravelStatus.onchange = (e) => { state.travelStatusFilter = e.target.value; render(); };

  // --- Prioritas Bongkar Inbound ---
  const bongkarSearchInput = document.getElementById('bongkarSearchInput');
  if (bongkarSearchInput) bongkarSearchInput.oninput = (e) => { state.bongkarFilters.search = e.target.value; render(); };

  const bongkarWarnaMsBtn = document.getElementById('bongkarWarnaMsBtn');
  if (bongkarWarnaMsBtn) bongkarWarnaMsBtn.onclick = (e) => { e.stopPropagation(); state.bongkarWarnaDropdownOpen = !state.bongkarWarnaDropdownOpen; render(); };

  document.querySelectorAll('[data-bongkar-warna-opt]').forEach(el => {
    el.onclick = (e) => e.stopPropagation();
    el.onchange = (e) => {
      const w = el.getAttribute('data-bongkar-warna-opt');
      const set = new Set(state.bongkarFilters.warna);
      if (e.target.checked) set.add(w); else set.delete(w);
      state.bongkarFilters.warna = Array.from(set);
      render();
    };
  });

  if (state.bongkarWarnaDropdownOpen){
    const panel = document.getElementById('bongkarWarnaMsPanel');
    if (panel) panel.onclick = (e) => e.stopPropagation();
    setTimeout(() => {
      document.addEventListener('click', function closeBongkarWarnaMs(){
        state.bongkarWarnaDropdownOpen = false; render();
        document.removeEventListener('click', closeBongkarWarnaMs);
      }, { once:true });
    }, 0);
  }

  const bongkarFilterPriority = document.getElementById('bongkarFilterPriority');
  if (bongkarFilterPriority) bongkarFilterPriority.onchange = (e) => { state.bongkarFilters.priorityLevel = e.target.value; render(); };

  const bongkarFilterEtaMode = document.getElementById('bongkarFilterEtaMode');
  if (bongkarFilterEtaMode) bongkarFilterEtaMode.onchange = (e) => { state.bongkarFilters.etaMode = e.target.value; if (e.target.value!=='tanggal') state.bongkarFilters.etaDate=''; render(); };

  const bongkarFilterEtaDate = document.getElementById('bongkarFilterEtaDate');
  if (bongkarFilterEtaDate) bongkarFilterEtaDate.onchange = (e) => { state.bongkarFilters.etaDate = e.target.value; render(); };

  const bongkarFilterShipmentStatus = document.getElementById('bongkarFilterShipmentStatus');
  if (bongkarFilterShipmentStatus) bongkarFilterShipmentStatus.onchange = (e) => { state.bongkarFilters.shipmentStatus = e.target.value; render(); };

  const bongkarSortSelect = document.getElementById('bongkarSortSelect');
  if (bongkarSortSelect) bongkarSortSelect.onchange = (e) => { state.bongkarSortMode = e.target.value; render(); };

  const bongkarResetBtn = document.getElementById('bongkarResetBtn');
  if (bongkarResetBtn) bongkarResetBtn.onclick = () => { state.bongkarFilters = { search:'', warna:[], priorityLevel:'', etaMode:'semua', etaDate:'', shipmentStatus:'', hppStatus:'' }; state.bongkarWarnaDropdownOpen=false; render(); };

  const bongkarFilterHpp = document.getElementById('bongkarFilterHpp');
  if (bongkarFilterHpp) bongkarFilterHpp.onchange = (e) => { state.bongkarFilters.hppStatus = e.target.value; render(); };

  const bongkarExportBtn = document.getElementById('bongkarExportBtn');
  if (bongkarExportBtn) bongkarExportBtn.onclick = () => {
    const db = computeBongkarDerived();
    exportBongkarXLSX(db.rows);
  };

  document.querySelectorAll('[data-bongkar-expand]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-bongkar-expand');
      if (state.expandedBongkarSet.has(key)) state.expandedBongkarSet.delete(key); else state.expandedBongkarSet.add(key);
      render();
    };
  });

  // --- Critical Item ---
  const ciFilterStore = document.getElementById('ciFilterStore');
  if (ciFilterStore) ciFilterStore.onchange = (e) => {
    state.criticalItemFilters.store = e.target.value === DEFAULT_STORE_KEY ? '' : e.target.value;
    state.criticalItemFilters.statusType = '';
    state.criticalItemFilters.statusValue = '';
    render();
  };

  const ciFilterStatusType = document.getElementById('ciFilterStatusType');
  if (ciFilterStatusType) ciFilterStatusType.onchange = (e) => {
    state.criticalItemFilters.statusType = e.target.value;
    state.criticalItemFilters.statusValue = '';
    render();
  };

  const ciFilterStatusValue = document.getElementById('ciFilterStatusValue');
  if (ciFilterStatusValue) ciFilterStatusValue.onchange = (e) => { state.criticalItemFilters.statusValue = e.target.value; render(); };

  const ciSearchInput = document.getElementById('ciSearchInput');
  if (ciSearchInput) ciSearchInput.oninput = (e) => { state.criticalItemFilters.search = e.target.value; render(); };

  const ciWarnaMsBtn = document.getElementById('ciWarnaMsBtn');
  if (ciWarnaMsBtn) ciWarnaMsBtn.onclick = (e) => { e.stopPropagation(); state.criticalItemWarnaDropdownOpen = !state.criticalItemWarnaDropdownOpen; render(); };

  document.querySelectorAll('[data-ci-warna-opt]').forEach(el => {
    el.onclick = (e) => e.stopPropagation();
    el.onchange = (e) => {
      const w = el.getAttribute('data-ci-warna-opt');
      const set = new Set(state.criticalItemFilters.warna);
      if (e.target.checked) set.add(w); else set.delete(w);
      state.criticalItemFilters.warna = Array.from(set);
      render();
    };
  });

  if (state.criticalItemWarnaDropdownOpen){
    const panel = document.getElementById('ciWarnaMsPanel');
    if (panel) panel.onclick = (e) => e.stopPropagation();
    setTimeout(() => {
      document.addEventListener('click', function closeCiWarnaMs(){
        state.criticalItemWarnaDropdownOpen = false; render();
        document.removeEventListener('click', closeCiWarnaMs);
      }, { once:true });
    }, 0);
  }

  const ciResetBtn = document.getElementById('ciResetBtn');
  if (ciResetBtn) ciResetBtn.onclick = () => {
    state.criticalItemFilters.statusValue = '';
    state.criticalItemFilters.warna = [];
    state.criticalItemFilters.search = '';
    state.criticalItemWarnaDropdownOpen = false;
    render();
  };

  document.querySelectorAll('[data-ci-color-toggle]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-ci-color-toggle');
      if (state.expandedCiColor.has(key)) state.expandedCiColor.delete(key); else state.expandedCiColor.add(key);
      render();
    };
  });
  document.querySelectorAll('[data-ci-lengan-toggle]').forEach(el => {
    el.onclick = () => {
      const key = el.getAttribute('data-ci-lengan-toggle');
      if (state.expandedCiLengan.has(key)) state.expandedCiLengan.delete(key); else state.expandedCiLengan.add(key);
      render();
    };
  });

  // --- On Production ---
  const opSearchInput = document.getElementById('opSearchInput');
  if (opSearchInput) opSearchInput.oninput = (e) => { state.onProductionFilters.search = e.target.value; render(); };

  // --- Item Tidak Cocok ---
  const umSearchInput = document.getElementById('umSearchInput');
  if (umSearchInput) umSearchInput.oninput = (e) => { state.unmatchedFilters.search = e.target.value; render(); };
}

render();
loadData();
autoRefreshId = setInterval(loadData, 120000);
</script>
</body>
</html>
